# Proves the SDK on every supported PHP version: syntax, the whole offline suite, and no known
# vulnerable dependency. The suite runs against a canned API - no network, no chain, no wallet.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    name: PHP ${{ matrix.php }}
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json, curl
          coverage: none
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist
      - name: Lint
        run: find src tests examples -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null
      - run: composer test
      # The SDK requires only php and ext-json, and Composer exits 1 when asked to audit nothing.
      # So: audit the lock file the moment it ever holds a package, and say so plainly until then.
      - name: Dependency audit
        run: |
          COUNT=$(php -r '$l = json_decode(file_get_contents("composer.lock"), true); echo count($l["packages"] ?? []) + count($l["packages-dev"] ?? []);')
          if [ "$COUNT" = "0" ]; then
            echo "composer.lock holds no packages - nothing to audit"
          else
            composer audit --locked
          fi
