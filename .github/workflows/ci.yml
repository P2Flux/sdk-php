# Proves the SDK on every supported PHP version: syntax, the whole offline suite, and no known
# vulnerable dependency. The suite runs against a canned API - no network, no chain, no wallet.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    name: PHP ${{ matrix.php }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json, curl
          coverage: none
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist
      - name: Lint
        run: find src tests examples -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null
      - run: composer test
      - run: composer audit
